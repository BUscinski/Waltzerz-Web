<!DOCTYPE html>
<html>
<head>
  <title>Waltzers Host</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #1a1a2e; color: #eee; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    h1 { color: #e94560; text-align: center; font-size: 36px; margin-bottom: 20px; }
    h2 { color: #eee; margin: 0 0 12px; border-bottom: 2px solid #e94560; padding-bottom: 8px; }

    .card { background: #16213e; border-radius: 10px; padding: 20px; margin: 14px 0; }

    #qr { text-align: center; margin: 10px 0; }

    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 10px; }
    input[type="number"] {
      font-size: 15px; padding: 10px 14px;
      border: 2px solid #0f3460; border-radius: 6px;
      background: #0f3460; color: #eee; outline: none; width: 160px;
    }
    input[type="number"]:focus { border-color: #e94560; }
    button {
      font-size: 15px; padding: 10px 22px; border: none;
      border-radius: 6px; cursor: pointer; background: #e94560; color: white;
    }
    button:hover { background: #c73652; }
    button.secondary { background: #555; }
    button.secondary:hover { background: #444; }

    .player-entry {
      display: flex; align-items: center; gap: 10px;
      font-size: 22px; font-weight: bold; margin: 8px 0;
    }
    .player-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }

    /* ── Debug menu ── */
    #debug-toggle {
      position: fixed; right: 0; top: 50%;
      transform: translateY(-50%);
      background: #0f3460; color: #aaa; border: none;
      padding: 10px 6px; border-radius: 6px 0 0 6px;
      cursor: pointer; font-size: 12px; writing-mode: vertical-rl;
      letter-spacing: 1px; z-index: 100;
    }
    #debug-toggle:hover { background: #1a2a5e; color: #eee; }

    #debug-panel {
      position: fixed; right: -260px; top: 0; height: 100%;
      width: 260px; background: #0d1b2a; border-left: 2px solid #0f3460;
      padding: 20px 16px; z-index: 99;
      transition: right 0.25s ease;
      display: flex; flex-direction: column; gap: 16px;
    }
    #debug-panel.open { right: 0; }
    #debug-panel h3 { color: #e94560; margin: 0; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
    #debug-panel label { color: #aaa; font-size: 13px; display: block; margin-bottom: 4px; }

    .debug-row { display: flex; gap: 8px; }
    .debug-row button {
      flex: 1; padding: 10px; font-size: 14px;
      background: #16213e; color: #eee; border: 1px solid #0f3460;
      border-radius: 6px; cursor: pointer;
    }
    .debug-row button:hover { background: #1a2a5e; }
    .debug-row button.active { background: #e94560; border-color: #e94560; color: #fff; }

    input[type="range"] {
      width: 100%; accent-color: #e94560; cursor: pointer;
    }
    #tempo-display { color: #e94560; font-size: 20px; font-weight: bold; text-align: center; }

    /* ── Footer credit ── */
    footer {
      text-align: center; color: #555; font-size: 12px;
      padding: 20px; margin-top: 10px;
    }
    footer a { color: #555; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Waltzers</h1>

    <div class="card" style="text-align:center">
      <h2>Scan to Join</h2>
      <div id="qr"></div>
    </div>

    <div class="card">
      <h2>Players</h2>
      <div id="players"><span style="color:#aaa">No players yet</span></div>
    </div>

    <div class="card">
      <h2>Game Controls</h2>
      <div class="controls">
        <button id="startGame">▶ Start Game</button>
        <button class="secondary" id="stopGame">■ Stop</button>
        <button class="secondary" id="resetGame">↺ Reset</button>
      </div>
      <div id="phase-indicator" style="text-align:center;margin-top:14px;font-size:20px;font-weight:bold;color:#aaa">—</div>
    </div>
  </div>

  <!-- Debug toggle button -->
  <button id="debug-toggle">DEBUG</button>

  <!-- Debug panel -->
  <div id="debug-panel">
    <h3>🎵 Audio Debug</h3>

    <div>
      <label>Playback</label>
      <div class="debug-row">
        <button id="audio-play">▶ Play</button>
        <button id="audio-stop">■ Stop</button>
      </div>
    </div>

    <div>
      <label>Tempo (manual override)</label>
      <div id="tempo-display">1.00×</div>
      <input type="range" id="tempo-slider" min="0.5" max="2.0" step="0.01" value="1.0" />
      <div style="display:flex;justify-content:space-between;color:#555;font-size:11px;margin-top:2px">
        <span>0.5×</span><span>1.0×</span><span>2.0×</span>
      </div>
    </div>

    <hr style="border:none;border-top:1px solid #1a2a5e;margin:4px 0">
    <h3>⚙️ Phase Config</h3>

    <div>
      <label>Duration per phase (seconds)</label>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <span style="color:#aaa;font-size:12px;white-space:nowrap">Min</span>
        <input type="number" id="cfg-min" value="7" min="1" max="120"
          style="width:55px;padding:6px;font-size:14px;background:#16213e;border:1px solid #0f3460;border-radius:4px;color:#eee;outline:none">
        <span style="color:#aaa;font-size:12px;white-space:nowrap">Max</span>
        <input type="number" id="cfg-max" value="20" min="1" max="120"
          style="width:55px;padding:6px;font-size:14px;background:#16213e;border:1px solid #0f3460;border-radius:4px;color:#eee;outline:none">
      </div>
    </div>

    <div>
      <label>Jerk multiplier (× noise floor)</label>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <span style="color:#aaa;font-size:12px;white-space:nowrap">Slow</span>
        <input type="number" id="cfg-slow-mult" value="10" min="1" max="100" step="0.5"
          style="width:55px;padding:6px;font-size:14px;background:#16213e;border:1px solid #0f3460;border-radius:4px;color:#eee;outline:none">
        <span style="color:#aaa;font-size:12px;white-space:nowrap">Fast</span>
        <input type="number" id="cfg-fast-mult" value="22" min="1" max="100" step="0.5"
          style="width:55px;padding:6px;font-size:14px;background:#16213e;border:1px solid #0f3460;border-radius:4px;color:#eee;outline:none">
      </div>
    </div>

    <div>
      <label>Audio tempo per phase</label>
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px">
        <span style="color:#aaa;font-size:12px;white-space:nowrap">Slow</span>
        <input type="number" id="cfg-slow-tempo" value="1.0" min="0.5" max="2.0" step="0.05"
          style="width:55px;padding:6px;font-size:14px;background:#16213e;border:1px solid #0f3460;border-radius:4px;color:#eee;outline:none">
        <span style="color:#aaa;font-size:12px;white-space:nowrap">Fast</span>
        <input type="number" id="cfg-fast-tempo" value="2.0" min="0.5" max="2.0" step="0.05"
          style="width:55px;padding:6px;font-size:14px;background:#16213e;border:1px solid #0f3460;border-radius:4px;color:#eee;outline:none">
      </div>
    </div>

    <button id="apply-config"
      style="width:100%;padding:8px;font-size:13px;background:#16213e;color:#eee;border:1px solid #0f3460;border-radius:6px;cursor:pointer;margin-top:4px">
      Apply Config
    </button>
  </div>

  <footer>
    Music: <a href="https://incompetech.com" target="_blank">Kevin MacLeod</a> —
    "Grand Dark Waltz Trio Vivace" — Licensed under
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    const socket = io('/waltzers');
    const playersDiv = document.getElementById('players');
    const players = {};

    let roomCode = null;
    const ROOM_KEY = 'waltzers_roomCode';

    function applyRoomCode(code, phoneUrl) {
      roomCode = code;
      const url = window.location.origin + phoneUrl;
      QRCode.toCanvas(url, (err, canvas) => {
        if (!err) {
          const qrEl = document.getElementById('qr');
          qrEl.innerHTML = '<div style="font-size:13px;color:#aaa;margin-bottom:6px">Scan to join</div>';
          qrEl.appendChild(canvas);
          const codeDiv = document.createElement('div');
          codeDiv.style.cssText = 'font-size:32px;font-weight:bold;letter-spacing:8px;color:#e94560;margin-top:8px';
          codeDiv.textContent = code;
          qrEl.appendChild(codeDiv);
          const label = document.createElement('p');
          label.style.cssText = 'font-size:12px;color:#aaa;margin:2px 0 0';
          label.textContent = 'room code';
          qrEl.appendChild(label);
        }
      });
      socket.emit('host_room', { roomCode: code });
    }

    const savedCode = sessionStorage.getItem(ROOM_KEY);
    if (savedCode) {
      applyRoomCode(savedCode, `/waltzerz-phone.html?room=${savedCode}`);
    } else {
      fetch('/api/room?game=waltzers')
        .then(r => r.json())
        .then(({ roomCode: code, phoneUrl }) => {
          sessionStorage.setItem(ROOM_KEY, code);
          applyRoomCode(code, phoneUrl);
        });
    }

    socket.on('connect', () => {
      if (roomCode) socket.emit('host_room', { roomCode });
    });

    socket.on('player_joined', ({ id, name, color }) => {
      players[id] = { name, color, out: false };
      renderPlayers();
    });

    socket.on('player_left', ({ id }) => {
      delete players[id];
      renderPlayers();
    });

    socket.on('player_out', ({ id, survivedMs }) => {
      if (players[id]) { players[id].out = true; players[id].survivedMs = survivedMs; renderPlayers(); }
    });

    socket.on('game_started', ({ phase }) => updatePhaseDisplay(phase));

    socket.on('phase_change', ({ phase }) => {
      updatePhaseDisplay(phase);
      const targetRate = phase === 'fast'
        ? parseFloat(document.getElementById('cfg-fast-tempo').value)
        : parseFloat(document.getElementById('cfg-slow-tempo').value);
      rampTempo(targetRate, 1.0);
    });

    socket.on('room_config', ({ minTime, maxTime, slowMult, fastMult }) => {
      document.getElementById('cfg-min').value = minTime;
      document.getElementById('cfg-max').value = maxTime;
      document.getElementById('cfg-slow-mult').value = slowMult;
      document.getElementById('cfg-fast-mult').value = fastMult;
    });

    socket.on('game_stopped', () => { updatePhaseDisplay(null); stopAudio(); });

    socket.on('game_over', ({ winner }) => {
      document.getElementById('phase-indicator').textContent = winner ? `🏆 ${winner} wins!` : 'Game over!';
      document.getElementById('phase-indicator').style.color = '#e94560';
      stopAudio();
    });

    socket.on('reset', () => {
      for (const id in players) players[id].out = false;
      renderPlayers();
      updatePhaseDisplay(null);
      stopAudio();
    });

    document.getElementById('startGame').onclick = async () => {
      socket.emit('start_game');
      await loadAudio();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      playAudio();
    };
    document.getElementById('stopGame').onclick  = () => socket.emit('stop_game');
    document.getElementById('resetGame').onclick = () => socket.emit('reset');

    document.getElementById('apply-config').onclick = () => {
      socket.emit('phase_config', {
        minTime:  parseFloat(document.getElementById('cfg-min').value),
        maxTime:  parseFloat(document.getElementById('cfg-max').value),
        slowMult: parseFloat(document.getElementById('cfg-slow-mult').value),
        fastMult: parseFloat(document.getElementById('cfg-fast-mult').value),
      });
    };

    function updatePhaseDisplay(phase) {
      const el = document.getElementById('phase-indicator');
      if (!phase)           { el.textContent = '—';         el.style.color = '#aaa'; }
      else if (phase === 'slow') { el.textContent = '🎵 SLOW'; el.style.color = '#aaa'; }
      else                  { el.textContent = '⚡ FAST'; el.style.color = '#e94560'; }
    }

    // ── Audio ─────────────────────────────────────────────────────────────────

    let audioCtx = null;
    let audioBuffer = null;
    let audioSource = null;

    async function loadAudio() {
      if (audioBuffer) return;
      audioCtx = new AudioContext();
      const resp = await fetch('/assets/audio/Grand Dark Waltz Trio Vivace.ogg');
      const arrayBuf = await resp.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    }

    function playAudio() {
      if (!audioBuffer) return;
      stopAudio();
      audioSource = audioCtx.createBufferSource();
      audioSource.buffer = audioBuffer;
      audioSource.loop = true;
      audioSource.playbackRate.value = parseFloat(document.getElementById('tempo-slider').value);
      audioSource.connect(audioCtx.destination);
      audioSource.start();
      document.getElementById('audio-play').classList.add('active');
    }

    function stopAudio() {
      if (audioSource) {
        audioSource.stop();
        audioSource.disconnect();
        audioSource = null;
      }
      document.getElementById('audio-play').classList.remove('active');
    }

    document.getElementById('audio-play').onclick = async () => {
      await loadAudio();
      // AudioContext requires a user gesture to start — resume if suspended
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      playAudio();
    };

    document.getElementById('audio-stop').onclick = stopAudio;

    document.getElementById('tempo-slider').oninput = (e) => {
      const rate = parseFloat(e.target.value);
      document.getElementById('tempo-display').textContent = rate.toFixed(2) + '×';
      if (audioSource) audioSource.playbackRate.value = rate;
    };

    function rampTempo(targetRate, durationSecs) {
      if (!audioSource) return;
      const startRate = audioSource.playbackRate.value;
      const startTime = audioCtx.currentTime;
      audioSource.playbackRate.setValueAtTime(startRate, startTime);
      audioSource.playbackRate.linearRampToValueAtTime(targetRate, startTime + durationSecs);
      // Keep slider in sync
      const slider = document.getElementById('tempo-slider');
      const display = document.getElementById('tempo-display');
      const steps = 20;
      let i = 0;
      const iv = setInterval(() => {
        i++;
        const t = i / steps;
        const v = startRate + (targetRate - startRate) * t;
        slider.value = v.toFixed(2);
        display.textContent = v.toFixed(2) + '×';
        if (i >= steps) clearInterval(iv);
      }, (durationSecs * 1000) / steps);
    }

    // ── Debug panel toggle ────────────────────────────────────────────────────

    document.getElementById('debug-toggle').onclick = () => {
      document.getElementById('debug-panel').classList.toggle('open');
    };

    function fmtTime(ms) {
      const s = ms / 1000;
      if (s < 60) return s.toFixed(1) + 's';
      const m = Math.floor(s / 60);
      return `${m}m ${(s % 60).toFixed(1)}s`;
    }

    function renderPlayers() {
      if (Object.keys(players).length === 0) {
        playersDiv.innerHTML = '<span style="color:#aaa">No players yet</span>';
        return;
      }
      playersDiv.innerHTML = '';
      for (const [id, p] of Object.entries(players)) {
        const div = document.createElement('div');
        div.className = 'player-entry';
        div.style.color = p.out ? '#555' : p.color;
        const timeLabel = p.out && p.survivedMs != null ? ` <span style="font-size:14px;color:#888">${fmtTime(p.survivedMs)}</span>` : '';
        div.innerHTML = `<span class="player-dot" style="background:${p.out ? '#555' : p.color}"></span>${p.name}${p.out ? ` <span style="font-size:16px;color:#e94560">(OUT)</span>${timeLabel}` : ''}`;
        playersDiv.appendChild(div);
      }
    }
  </script>
</body>
</html>
