<!DOCTYPE html>
<html>
<head>
  <title>Waltzers Host</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #1a1a2e; color: #eee; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    h1 { color: #e94560; text-align: center; font-size: 36px; margin-bottom: 20px; }
    h2 { color: #eee; margin: 0 0 12px; border-bottom: 2px solid #e94560; padding-bottom: 8px; }

    .card { background: #16213e; border-radius: 10px; padding: 20px; margin: 14px 0; }

    #qr { text-align: center; margin: 10px 0; }

    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 10px; }
    input[type="number"] {
      font-size: 15px; padding: 10px 14px;
      border: 2px solid #0f3460; border-radius: 6px;
      background: #0f3460; color: #eee; outline: none; width: 160px;
    }
    input[type="number"]:focus { border-color: #e94560; }
    button {
      font-size: 15px; padding: 10px 22px; border: none;
      border-radius: 6px; cursor: pointer; background: #e94560; color: white;
    }
    button:hover { background: #c73652; }
    button.secondary { background: #555; }
    button.secondary:hover { background: #444; }

    .player-entry {
      display: flex; align-items: center; gap: 10px;
      font-size: 22px; font-weight: bold; margin: 8px 0;
    }
    .player-dot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }

    /* ── Debug menu ── */
    #debug-toggle {
      position: fixed; right: 0; top: 50%;
      transform: translateY(-50%);
      background: #0f3460; color: #aaa; border: none;
      padding: 10px 6px; border-radius: 6px 0 0 6px;
      cursor: pointer; font-size: 12px; writing-mode: vertical-rl;
      letter-spacing: 1px; z-index: 100;
    }
    #debug-toggle:hover { background: #1a2a5e; color: #eee; }

    #debug-panel {
      position: fixed; right: -260px; top: 0; height: 100%;
      width: 260px; background: #0d1b2a; border-left: 2px solid #0f3460;
      padding: 20px 16px; z-index: 99;
      transition: right 0.25s ease;
      display: flex; flex-direction: column; gap: 16px;
    }
    #debug-panel.open { right: 0; }
    #debug-panel h3 { color: #e94560; margin: 0; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
    #debug-panel label { color: #aaa; font-size: 13px; display: block; margin-bottom: 4px; }

    .debug-row { display: flex; gap: 8px; }
    .debug-row button {
      flex: 1; padding: 10px; font-size: 14px;
      background: #16213e; color: #eee; border: 1px solid #0f3460;
      border-radius: 6px; cursor: pointer;
    }
    .debug-row button:hover { background: #1a2a5e; }
    .debug-row button.active { background: #e94560; border-color: #e94560; color: #fff; }

    input[type="range"] {
      width: 100%; accent-color: #e94560; cursor: pointer;
    }
    #tempo-display { color: #e94560; font-size: 20px; font-weight: bold; text-align: center; }

    /* ── Footer credit ── */
    footer {
      text-align: center; color: #555; font-size: 12px;
      padding: 20px; margin-top: 10px;
    }
    footer a { color: #555; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Waltzers</h1>

    <div class="card" style="text-align:center">
      <h2>Scan to Join</h2>
      <div id="qr"></div>
    </div>

    <div class="card">
      <h2>Players</h2>
      <div id="players"><span style="color:#aaa">No players yet</span></div>
    </div>

    <div class="card">
      <h2>Game Controls</h2>
      <div class="controls">
        <input type="number" id="accelThresh" placeholder="Accel threshold" value="50" />
        <input type="number" id="rotThresh" placeholder="Rot threshold" value="100" />
        <button id="updateThresh">Update Thresholds</button>
        <button class="secondary" id="resetGame">Reset Game</button>
      </div>
    </div>
  </div>

  <!-- Debug toggle button -->
  <button id="debug-toggle">DEBUG</button>

  <!-- Debug panel -->
  <div id="debug-panel">
    <h3>🎵 Audio Debug</h3>

    <div>
      <label>Playback</label>
      <div class="debug-row">
        <button id="audio-play">▶ Play</button>
        <button id="audio-stop">■ Stop</button>
      </div>
    </div>

    <div>
      <label>Tempo</label>
      <div id="tempo-display">1.00×</div>
      <input type="range" id="tempo-slider" min="0.5" max="2.0" step="0.01" value="1.0" />
      <div style="display:flex;justify-content:space-between;color:#555;font-size:11px;margin-top:2px">
        <span>0.5×</span><span>1.0×</span><span>2.0×</span>
      </div>
    </div>
  </div>

  <footer>
    Music: <a href="https://incompetech.com" target="_blank">Kevin MacLeod</a> —
    "Grand Dark Waltz Trio Vivace" — Licensed under
    <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank">CC BY 4.0</a>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <script>
    const socket = io('/waltzers');
    const playersDiv = document.getElementById('players');
    const players = {};

    let roomCode = null;
    const ROOM_KEY = 'waltzers_roomCode';

    function applyRoomCode(code, phoneUrl) {
      roomCode = code;
      const url = window.location.origin + phoneUrl;
      QRCode.toCanvas(url, (err, canvas) => {
        if (!err) {
          const qrEl = document.getElementById('qr');
          qrEl.innerHTML = '<div style="font-size:13px;color:#aaa;margin-bottom:6px">Scan to join</div>';
          qrEl.appendChild(canvas);
          const codeDiv = document.createElement('div');
          codeDiv.style.cssText = 'font-size:32px;font-weight:bold;letter-spacing:8px;color:#e94560;margin-top:8px';
          codeDiv.textContent = code;
          qrEl.appendChild(codeDiv);
          const label = document.createElement('p');
          label.style.cssText = 'font-size:12px;color:#aaa;margin:2px 0 0';
          label.textContent = 'room code';
          qrEl.appendChild(label);
        }
      });
      socket.emit('host_room', { roomCode: code });
    }

    const savedCode = sessionStorage.getItem(ROOM_KEY);
    if (savedCode) {
      applyRoomCode(savedCode, `/phone.html?room=${savedCode}`);
    } else {
      fetch('/api/room?game=waltzers')
        .then(r => r.json())
        .then(({ roomCode: code, phoneUrl }) => {
          sessionStorage.setItem(ROOM_KEY, code);
          applyRoomCode(code, phoneUrl);
        });
    }

    socket.on('connect', () => {
      if (roomCode) socket.emit('host_room', { roomCode });
    });

    socket.on('player_joined', ({ id, name, color }) => {
      players[id] = { name, color, out: false };
      renderPlayers();
    });

    socket.on('player_left', ({ id }) => {
      delete players[id];
      renderPlayers();
    });

    socket.on('player_out', ({ id }) => {
      if (players[id]) { players[id].out = true; renderPlayers(); }
    });

    socket.on('reset', () => {
      for (const id in players) players[id].out = false;
      renderPlayers();
    });

    document.getElementById('updateThresh').onclick = () => {
      socket.emit('update_thresholds', {
        accel: parseFloat(document.getElementById('accelThresh').value),
        rot: parseFloat(document.getElementById('rotThresh').value),
      });
    };

    document.getElementById('resetGame').onclick = () => socket.emit('reset');

    // ── Audio ─────────────────────────────────────────────────────────────────

    let audioCtx = null;
    let audioBuffer = null;
    let audioSource = null;

    async function loadAudio() {
      if (audioBuffer) return;
      audioCtx = new AudioContext();
      const resp = await fetch('/assets/audio/Grand Dark Waltz Trio Vivace.ogg');
      const arrayBuf = await resp.arrayBuffer();
      audioBuffer = await audioCtx.decodeAudioData(arrayBuf);
    }

    function playAudio() {
      if (!audioBuffer) return;
      stopAudio();
      audioSource = audioCtx.createBufferSource();
      audioSource.buffer = audioBuffer;
      audioSource.loop = true;
      audioSource.playbackRate.value = parseFloat(document.getElementById('tempo-slider').value);
      audioSource.connect(audioCtx.destination);
      audioSource.start();
      document.getElementById('audio-play').classList.add('active');
    }

    function stopAudio() {
      if (audioSource) {
        audioSource.stop();
        audioSource.disconnect();
        audioSource = null;
      }
      document.getElementById('audio-play').classList.remove('active');
    }

    document.getElementById('audio-play').onclick = async () => {
      await loadAudio();
      // AudioContext requires a user gesture to start — resume if suspended
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      playAudio();
    };

    document.getElementById('audio-stop').onclick = stopAudio;

    document.getElementById('tempo-slider').oninput = (e) => {
      const rate = parseFloat(e.target.value);
      document.getElementById('tempo-display').textContent = rate.toFixed(2) + '×';
      if (audioSource) audioSource.playbackRate.value = rate;
    };

    // ── Debug panel toggle ────────────────────────────────────────────────────

    document.getElementById('debug-toggle').onclick = () => {
      document.getElementById('debug-panel').classList.toggle('open');
    };

    function renderPlayers() {
      if (Object.keys(players).length === 0) {
        playersDiv.innerHTML = '<span style="color:#aaa">No players yet</span>';
        return;
      }
      playersDiv.innerHTML = '';
      for (const [id, p] of Object.entries(players)) {
        const div = document.createElement('div');
        div.className = 'player-entry';
        div.style.color = p.out ? '#555' : p.color;
        div.innerHTML = `<span class="player-dot" style="background:${p.out ? '#555' : p.color}"></span>${p.name}${p.out ? ' <span style="font-size:16px;color:#e94560">(OUT)</span>' : ''}`;
        playersDiv.appendChild(div);
      }
    }
  </script>
</body>
</html>
