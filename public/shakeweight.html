<!DOCTYPE html>
<html>
<head>
  <title>Shake Weight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    /* ── Shake Weight-specific ── */
    #qr-display { text-align: center; }
    #qrcode { display: inline-block; background: white; padding: 8px; border-radius: 6px; }

    #countdown-display { font-size: 72px; font-weight: bold; text-align: center; color: var(--danger); margin: 16px 0; }

    .player-item { background: var(--surface-2); padding: 14px 16px; margin: 10px 0; border-radius: var(--radius); border-left: 4px solid var(--accent); }
    .player-name { font-weight: bold; font-size: 18px; }
    .player-score { font-size: 15px; color: var(--text-muted); margin-top: 6px; }
    .progress-bar-container { background: var(--bg); height: 18px; border-radius: 10px; overflow: hidden; margin-top: 8px; }
    .progress-bar { background: var(--accent); height: 100%; width: 0%; transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: #09090f; font-size: 11px; font-weight: bold; }

    #leaderboard { display: none; text-align: center; }
    .winner-banner { background: var(--danger); color: white; font-size: 32px; font-weight: bold; padding: 20px; border-radius: 10px; margin-bottom: 16px; }
    .leaderboard-entry { background: var(--surface-2); padding: 14px 16px; margin: 8px 0; border-radius: var(--radius); font-size: 18px; }
    .leaderboard-entry.first { background: #5a4000; font-weight: bold; }
    .leaderboard-entry.second { background: var(--surface-2); }
    .leaderboard-entry.third { background: #3a2a1a; }

    #game-status { font-size: 16px; text-align: center; color: var(--text-muted); margin: 10px 0; }
    #threshold-display { font-size: 18px; font-weight: bold; color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="page-title">Shake Weight</h1>

    <div class="card qr-block" id="qr-display">
      <h2>Join Game</h2>
      <p>Scan to join on your phone</p>
      <div id="qrcode" class="qr-wrap"><div style="width:200px;height:200px;background:var(--surface-2);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13px">Creating room...</div></div>
      <div class="room-code-label" id="room-code-display">—</div>
      <p class="room-code-sub">room code</p>
    </div>

    <div class="card controls" style="text-align:center">
      <button class="primary" id="start-btn" disabled>Start Game</button>
      <button class="secondary" id="reset-btn">Reset Game</button>
    </div>

    <div id="countdown-display"></div>

    <div class="card" id="players-section" style="display:none">
      <h2>Player Scores</h2>
      <div id="game-status"></div>
      <div id="player-list"></div>
    </div>

    <div id="leaderboard" class="card">
      <h2>Game Over!</h2>
      <div class="winner-banner" id="winner-banner"></div>
      <div id="leaderboard-list"></div>
      <button class="secondary" id="play-again-btn" style="margin-top:16px">Play Again</button>
    </div>
  </div>

  <!-- Debug toggle -->
  <button id="debug-toggle">DEBUG</button>

  <!-- Debug panel -->
  <div id="debug-panel">
    <h3>⚙️ Game Settings</h3>

    <div>
      <label>Score Threshold</label>
      <div class="debug-number-row">
        <input type="number" id="threshold-input" value="300" min="50" max="5000" step="50" style="width:90px">
        <span id="threshold-display">300</span>
      </div>
      <label style="margin-top:6px">First to reach this score wins. Lower = shorter game.</label>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io('/shakeweight');
    let players = {};
    let gameActive = false;
    let jerkThreshold = 300;

    let roomCode = null;
    const ROOM_KEY = 'shakeweight_roomCode';

    function applyRoomCode(code, phoneUrl) {
      roomCode = code;
      document.getElementById('qrcode').innerHTML = '';
      new QRCode(document.getElementById('qrcode'), {
        text: window.location.origin + phoneUrl, width: 200, height: 200
      });
      const codeEl = document.getElementById('room-code-display');
      if (codeEl) codeEl.textContent = code;
      socket.emit('host_room', { roomCode: code });
    }

    const savedCode = sessionStorage.getItem(ROOM_KEY);
    if (savedCode) {
      applyRoomCode(savedCode, `/shakeweight-phone.html?room=${savedCode}`);
    } else {
      fetch('/api/room?game=shakeweight')
        .then(r => r.json())
        .then(({ roomCode: code, phoneUrl }) => {
          sessionStorage.setItem(ROOM_KEY, code);
          applyRoomCode(code, phoneUrl);
        });
    }

    socket.on('connect', () => {
      if (roomCode) socket.emit('host_room', { roomCode });
    });

    document.getElementById('threshold-input').addEventListener('input', (e) => {
      jerkThreshold = parseInt(e.target.value);
      document.getElementById('threshold-display').textContent = jerkThreshold;
    });

    document.getElementById('start-btn').onclick = () => {
      if (Object.keys(players).length > 0) {
        socket.emit('start_shakeweight_game', { threshold: jerkThreshold });
        document.getElementById('threshold-input').disabled = true;
      }
    };

    document.getElementById('reset-btn').onclick = () => {
      socket.emit('reset_shakeweight_game');
      location.reload();
    };

    document.getElementById('play-again-btn').onclick = () => {
      socket.emit('reset_shakeweight_game');
      location.reload();
    };

    document.getElementById('debug-toggle').onclick = () => {
      document.getElementById('debug-panel').classList.toggle('open');
    };

    socket.on('player_joined', ({ playerId, playerName }) => {
      players[playerId] = { name: playerName, jerk: 0 };
      document.getElementById('players-section').style.display = 'block';
      updatePlayersList();
      document.getElementById('start-btn').disabled = false;
    });

    socket.on('player_left', ({ playerId }) => {
      delete players[playerId];
      updatePlayersList();
      if (Object.keys(players).length === 0) document.getElementById('start-btn').disabled = true;
    });

    socket.on('game_started', () => {
      gameActive = true;
      Object.keys(players).forEach(id => { players[id].jerk = 0; });
      updatePlayersList();
      document.getElementById('qr-display').style.display = 'none';
      document.getElementById('start-btn').disabled = true;
      document.getElementById('threshold-input').disabled = true;
    });

    socket.on('countdown', ({ time }) => {
      const el = document.getElementById('countdown-display');
      if (time > 0) {
        el.textContent = time;
      } else {
        el.textContent = 'GO!';
        setTimeout(() => { el.textContent = ''; }, 1000);
      }
    });

    socket.on('jerk_scores_update', ({ scores }) => {
      if (!gameActive) return;
      Object.keys(scores).forEach(id => {
        if (players[id]) players[id].jerk = scores[id];
      });
      updatePlayersList();
    });

    socket.on('game_ended', ({ winner, finalScores }) => {
      gameActive = false;
      document.getElementById('players-section').style.display = 'none';
      document.getElementById('leaderboard').style.display = 'block';
      document.getElementById('winner-banner').textContent = `🏆 ${winner.name} Wins!`;

      const sorted = Object.entries(finalScores).sort((a, b) => b[1] - a[1]);
      document.getElementById('leaderboard-list').innerHTML = sorted.map(([id, score], i) => {
        const name = players[id]?.name ?? 'Unknown';
        const cls = i === 0 ? 'first' : i === 1 ? 'second' : i === 2 ? 'third' : '';
        return `<div class="leaderboard-entry ${cls}">${i + 1}. ${name} — ${Math.floor(score)}</div>`;
      }).join('');
    });

    function updatePlayersList() {
      document.getElementById('game-status').textContent =
        gameActive ? 'Game in progress!' : 'Waiting to start...';
      document.getElementById('player-list').innerHTML = Object.entries(players).map(([id, p]) => {
        const pct = Math.min((p.jerk / jerkThreshold) * 100, 100);
        return `
          <div class="player-item">
            <div class="player-name">${p.name}</div>
            <div class="player-score">${Math.floor(p.jerk)} / ${jerkThreshold}</div>
            <div class="progress-bar-container">
              <div class="progress-bar" style="width:${pct}%">${pct > 12 ? Math.floor(pct) + '%' : ''}</div>
            </div>
          </div>`;
      }).join('');
    }
  </script>
</body>
</html>
