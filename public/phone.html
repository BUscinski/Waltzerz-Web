<!DOCTYPE html>
<html>
<head>
  <title>Waltzers Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; margin: 0; padding: 24px;
      background: #1a1a2e; color: #eee; min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
    }
    h1 { color: #e94560; font-size: 32px; margin: 0 0 24px; }

    .card {
      background: #16213e; border-radius: 12px; padding: 20px;
      width: 100%; max-width: 440px; margin-bottom: 16px;
    }

    input[type="text"] {
      width: 100%; padding: 14px; font-size: 18px;
      border: 2px solid #0f3460; border-radius: 8px;
      background: #0f3460; color: #eee; outline: none; margin-bottom: 12px;
    }
    input[type="text"]:focus { border-color: #e94560; }

    button.primary {
      width: 100%; padding: 16px; font-size: 20px; font-weight: bold;
      background: #e94560; color: white; border: none;
      border-radius: 8px; cursor: pointer;
    }

    .hidden { display: none !important; }

    /* ── Waiting screen ── */
    #screen-waiting {
      width: 100%; max-width: 440px;
      text-align: center; padding-top: 40px;
    }
    #waiting-msg { color: #aaa; font-size: 20px; margin: 0; line-height: 1.6; }

    /* ── Playing screen ── */
    #screen-playing { width: 100%; max-width: 440px; }

    #phase-banner {
      text-align: center; font-size: 28px; font-weight: bold;
      padding: 16px; border-radius: 10px; margin-bottom: 16px;
      transition: background 0.8s, color 0.8s;
      background: #16213e; color: #aaa;
    }
    #phase-banner.slow { background: #16213e; color: #aaa; }
    #phase-banner.fast { background: #e94560; color: #fff; }

    #you-status {
      text-align: center; font-size: 36px; font-weight: bold;
      margin: 16px 0; color: #eee;
    }
    #you-status.out { color: #e94560; }

    /* ── Debug data ── */
    .data-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;
    }
    .data-item {
      background: #0f3460; border-radius: 8px; padding: 10px;
      text-align: center;
    }
    .data-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
    .data-value { font-size: 18px; font-weight: bold; color: #e94560; }
  </style>
</head>
<body>
  <h1>Waltzers</h1>

  <!-- JOIN -->
  <div id="screen-join" class="card">
    <div id="room-display" style="text-align:center;margin-bottom:16px;display:none">
      <span style="color:#aaa;font-size:13px">Room</span>
      <div id="room-code-show" style="font-size:36px;font-weight:bold;letter-spacing:8px;color:#e94560"></div>
    </div>
    <input type="text" id="room-input" placeholder="Room code (e.g. XKQF)" maxlength="4"
      style="text-transform:uppercase;letter-spacing:4px;font-size:22px;text-align:center" />
    <input type="text" id="name" placeholder="Your name" />
    <p id="join-error" style="color:#e94560;text-align:center;font-size:14px;min-height:18px;margin:0 0 8px"></p>
    <button class="primary" id="join-btn">Join Game</button>
  </div>

  <!-- WAITING -->
  <div id="screen-waiting" class="hidden">
    <p id="waiting-msg">Joined! Waiting for host to start...</p>
  </div>

  <!-- PLAYING -->
  <div id="screen-playing" class="hidden">
    <div id="phase-banner">WAITING</div>
    <div id="you-status">—</div>
    <div class="card">
      <div class="data-grid">
        <div class="data-item"><div class="data-label">Jerk Mag</div><div class="data-value" id="d-jmag">--</div></div>
        <div class="data-item"><div class="data-label">Threshold</div><div class="data-value" id="d-thresh">--</div></div>
        <div class="data-item"><div class="data-label">Noise Floor</div><div class="data-value" id="d-noise">--</div></div>
        <div class="data-item"><div class="data-label">Multiplier</div><div class="data-value" id="d-mult">--</div></div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io('/waltzers');

    // ── Room code from URL ────────────────────────────────────────────────────
    const urlRoom = new URLSearchParams(window.location.search).get('room');
    if (urlRoom) {
      const code = urlRoom.toUpperCase();
      document.getElementById('room-display').style.display = 'block';
      document.getElementById('room-code-show').textContent = code;
      document.getElementById('room-input').style.display = 'none';
    }

    function showScreen(id) {
      ['screen-join', 'screen-waiting', 'screen-playing'].forEach(s =>
        document.getElementById(s).classList.toggle('hidden', s !== id)
      );
    }

    // ── Calibration ───────────────────────────────────────────────────────────
    let noiseFloor = null;
    let calibSamples = [];
    let calibrating = false;

    function startCalibration() {
      calibSamples = [];
      calibrating = true;
      setTimeout(finishCalibration, 2500);
    }

    function finishCalibration() {
      if (!calibrating) return;
      calibrating = false;
      if (calibSamples.length < 5) { noiseFloor = 50; return; }
      const mean = calibSamples.reduce((a, b) => a + b, 0) / calibSamples.length;
      const variance = calibSamples.reduce((s, x) => s + (x - mean) ** 2, 0) / calibSamples.length;
      noiseFloor = mean + 3 * Math.sqrt(variance);
      document.getElementById('d-noise').textContent = noiseFloor.toFixed(1);
      console.log('Noise floor calibrated:', noiseFloor.toFixed(2));
    }

    // ── Detection state ───────────────────────────────────────────────────────
    let currentMult = 10;
    let targetMult = 10;
    let transitionStart = null;
    const TRANSITION_MS = 1000;
    let lastHitTime = 0;
    const DEBOUNCE_MS = 400;
    let gameRunning = false;
    let isOut = false;
    let myId = null;

    function getLiveMult() {
      if (transitionStart === null) return currentMult;
      const t = Math.min((Date.now() - transitionStart) / TRANSITION_MS, 1);
      const m = currentMult + (targetMult - currentMult) * t;
      if (t >= 1) { currentMult = targetMult; transitionStart = null; }
      return m;
    }

    // ── IMU ───────────────────────────────────────────────────────────────────
    const HISTORY = 5;
    let aXH = [], aYH = [], aZH = [];
    let prevTime = null, prevSm = null;

    function avg(arr) { return arr.length ? arr.reduce((a, b) => a + b) / arr.length : 0; }
    function push(arr, v) { arr.push(v); if (arr.length > HISTORY) arr.shift(); }

    function startMotion() {
      window.addEventListener('devicemotion', (event) => {
        const raw = {
          x: event.acceleration?.x ?? 0,
          y: event.acceleration?.y ?? 0,
          z: event.acceleration?.z ?? 0,
        };

        push(aXH, raw.x); push(aYH, raw.y); push(aZH, raw.z);
        const sm = { x: avg(aXH), y: avg(aYH), z: avg(aZH) };
        const t = event.timeStamp;

        if (prevTime !== null && prevSm !== null) {
          const dt = (t - prevTime) / 1000;
          if (dt > 0 && dt < 0.1) {
            const jx = (sm.x - prevSm.x) / dt;
            const jy = (sm.y - prevSm.y) / dt;
            const jz = (sm.z - prevSm.z) / dt;
            const jMag = Math.sqrt(jx**2 + jy**2 + jz**2);

            if (calibrating) {
              calibSamples.push(jMag);
            } else {
              const mult = getLiveMult();
              const threshold = noiseFloor != null ? noiseFloor * mult : Infinity;

              document.getElementById('d-jmag').textContent = jMag.toFixed(1);
              document.getElementById('d-thresh').textContent = isFinite(threshold) ? threshold.toFixed(1) : '—';
              document.getElementById('d-mult').textContent = mult.toFixed(1);

              const now = Date.now();
              if (gameRunning && !isOut && noiseFloor != null
                  && jMag > threshold && now - lastHitTime > DEBOUNCE_MS) {
                lastHitTime = now;
                socket.emit('player_hit');
                navigator.vibrate?.(200);
              }
            }
          }
        }

        prevTime = t;
        prevSm = { ...sm };
      });
    }

    // ── Join ──────────────────────────────────────────────────────────────────
    document.getElementById('join-btn').onclick = async () => {
      const code = urlRoom
        ? urlRoom.toUpperCase()
        : document.getElementById('room-input').value.trim().toUpperCase();
      const name = document.getElementById('name').value.trim();
      if (!code || !name) return;

      document.getElementById('join-btn').disabled = true;
      document.getElementById('join-error').textContent = '';

      if (typeof DeviceMotionEvent.requestPermission === 'function') {
        try { await DeviceMotionEvent.requestPermission(); }
        catch { document.getElementById('join-error').textContent = 'Motion permission required.'; document.getElementById('join-btn').disabled = false; return; }
      }

      socket.emit('join_room', { code, name });
    };

    socket.on('room_error', ({ error }) => {
      document.getElementById('join-error').textContent = error;
      document.getElementById('join-btn').disabled = false;
    });

    socket.on('player_joined', ({ id }) => {
      if (id !== socket.id) return;
      myId = socket.id;
      startMotion();
      startCalibration();
      showScreen('screen-waiting');
    });

    // ── Game events ───────────────────────────────────────────────────────────
    socket.on('game_started', ({ phase, multiplier }) => {
      gameRunning = true;
      isOut = false;
      currentMult = multiplier;
      targetMult = multiplier;
      transitionStart = null;
      updatePhase(phase);
      document.getElementById('you-status').textContent = 'YOU\'RE IN!';
      document.getElementById('you-status').classList.remove('out');
      showScreen('screen-playing');
    });

    socket.on('phase_change', ({ phase, multiplier }) => {
      targetMult = multiplier;
      transitionStart = Date.now();
      updatePhase(phase);
    });

    socket.on('player_out', ({ id }) => {
      if (id === socket.id) {
        isOut = true;
        gameRunning = false;
        document.getElementById('you-status').textContent = 'YOU\'RE OUT!';
        document.getElementById('you-status').classList.add('out');
        navigator.vibrate?.([200, 100, 200]);
      }
    });

    socket.on('game_over', ({ winner }) => {
      gameRunning = false;
      if (!isOut) {
        document.getElementById('you-status').textContent = winner ? `🏆 ${winner} wins!` : 'Game over!';
      }
    });

    socket.on('game_stopped', () => {
      gameRunning = false;
      showScreen('screen-waiting');
      document.getElementById('waiting-msg').textContent = 'Game stopped. Waiting for host...';
    });

    socket.on('reset', () => {
      gameRunning = false;
      isOut = false;
      noiseFloor = null;
      currentMult = 10; targetMult = 10; transitionStart = null;
      document.getElementById('join-btn').disabled = false;
      document.getElementById('join-error').textContent = '';
      showScreen('screen-join');
    });

    socket.on('player_left', () => {});

    function updatePhase(phase) {
      const banner = document.getElementById('phase-banner');
      banner.textContent = phase === 'fast' ? '⚡ FAST' : '🎵 SLOW';
      banner.className = phase;
    }
  </script>
</body>
</html>
